<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halaman Tidak Dapat Dimuat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 60px 20px;
            background: #f4f6f9;
            color: #263238;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            border-radius: 10px;
            padding: 48px 36px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            border: 1px solid #e0e6ed;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #fdecea;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
            color: #d32f2f;
            font-size: 40px;
        }
        h1 {
            color: #d32f2f;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        p {
            color: #546e7a;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn-retry {
            background-color: #1565c0;
            color: #ffffff;
            padding: 12px 32px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(21, 101, 192, 0.25);
            transition: background-color 0.15s ease, transform 0.1s ease;
        }
        .btn-retry:hover {
            background-color: #0d47a1;
        }
        .btn-retry:active {
            transform: scale(0.98);
        }
        .hint {
            margin-top: 24px;
            font-size: 13px;
            color: #90a4ae;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-circle">&#9888;</div>
        <h1>Halaman Tidak Dapat Dimuat</h1>
        <p>Tidak dapat terhubung ke server ujian atau halaman yang dituju tidak diizinkan. Silakan periksa koneksi jaringan Anda atau hubungi pengawas ruang ujian.</p>
        <button class="btn-retry" onclick="window.chrome.webview.postMessage('retry')">Coba Lagi</button>
        <div class="hint">ExamBro Secure Browser</div>
    </div>
</body>
</html>
